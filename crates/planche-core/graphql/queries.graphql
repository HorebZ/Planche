query Viewer {
  viewer { id login name avatarUrl }
  rateLimit { limit cost remaining resetAt }
}

query ListProjects($login: String!, $isOrg: Boolean!, $after: String) {
  user(login: $login) @skip(if: $isOrg) {
    projectsV2(first: 50, after: $after) { ...ProjectSummaryPage }
  }
  organization(login: $login) @include(if: $isOrg) {
    projectsV2(first: 50, after: $after) { ...ProjectSummaryPage }
  }
  rateLimit { cost remaining resetAt }
}

fragment ProjectSummaryPage on ProjectV2Connection {
  pageInfo { hasNextPage endCursor }
  nodes { id number title closed url updatedAt }
}

# One round trip for `<owner>/<number>`: resolves the owner, then returns the metadata and the
# first page of items. `repositoryOwner` covers users and organizations alike.
query ProjectBoard($login: String!, $viewer: Boolean!, $number: Int!) {
  viewer @include(if: $viewer) {
    projectV2(number: $number) { ...ProjectMetaFields items(first: 100) { ...ProjectItemPage } }
  }
  repositoryOwner(login: $login) @skip(if: $viewer) {
    ... on ProjectV2Owner {
      projectV2(number: $number) { ...ProjectMetaFields items(first: 100) { ...ProjectItemPage } }
    }
  }
  rateLimit { cost remaining resetAt }
}

query ProjectMeta($projectId: ID!) {
  node(id: $projectId) {
    ... on ProjectV2 { ...ProjectMetaFields }
  }
  rateLimit { cost remaining resetAt }
}

query ProjectItems($projectId: ID!, $after: String) {
  node(id: $projectId) {
    ... on ProjectV2 {
      items(first: 100, after: $after) { ...ProjectItemPage }
    }
  }
  rateLimit { cost remaining resetAt }
}

fragment ProjectMetaFields on ProjectV2 {
  id number title url updatedAt
  owner {
    __typename
    ... on User { login }
    ... on Organization { login }
  }
  fields(first: 50) {
    nodes {
      __typename
      ... on ProjectV2FieldCommon { id name dataType }
      ... on ProjectV2SingleSelectField { options { id name color description } }
    }
  }
  views(first: 30) {
    nodes {
      id number name layout filter
      verticalGroupByFields(first: 1) {
        nodes { ... on ProjectV2FieldCommon { id } }
      }
      sortByFields(first: 1) { totalCount }
    }
  }
}

fragment ProjectItemPage on ProjectV2ItemConnection {
  totalCount
  pageInfo { hasNextPage endCursor }
  nodes {
    id type isArchived updatedAt
    fieldValues(first: 20) {
      nodes {
        __typename
        ... on ProjectV2ItemFieldSingleSelectValue { optionId field { ...FieldId } }
        ... on ProjectV2ItemFieldTextValue { text field { ...FieldId } }
        ... on ProjectV2ItemFieldNumberValue { number field { ...FieldId } }
        ... on ProjectV2ItemFieldDateValue { date field { ...FieldId } }
        ... on ProjectV2ItemFieldIterationValue { iterationId field { ...FieldId } }
      }
    }
    content {
      __typename
      ... on DraftIssue {
        id title updatedAt
        assignees(first: 10) { nodes { ...UserLite } }
      }
      ... on Issue {
        id number title url issueState: state updatedAt createdAt
        parent { title }
        subIssuesSummary { completed total }
        issueDependenciesSummary { blockedBy blocking }
        closedByPullRequestsReferences(first: 1, includeClosedPrs: true) {
          totalCount
          nodes { number title prState: state isDraft }
        }
        repository { nameWithOwner }
        assignees(first: 10) { nodes { ...UserLite } }
        labels(first: 10) { nodes { name color } }
      }
      ... on PullRequest {
        id number title url prState: state isDraft updatedAt createdAt
        repository { nameWithOwner }
        assignees(first: 10) { nodes { ...UserLite } }
        labels(first: 10) { nodes { name color } }
      }
    }
  }
}

fragment FieldId on ProjectV2FieldConfiguration {
  ... on ProjectV2FieldCommon { id }
}

fragment UserLite on User { id login avatarUrl }

query AssignableUsers($owner: String!, $name: String!) {
  repository(owner: $owner, name: $name) {
    assignableUsers(first: 100) { nodes { ...UserLite } }
  }
}
