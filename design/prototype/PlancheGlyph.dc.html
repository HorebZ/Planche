<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<span style="display:inline-flex;align-items:center;justify-content:center;flex:none;line-height:0;vertical-align:middle">
<sc-if value="{{ isDraft }}" hint-placeholder-val="{{ false }}"><svg width="{{ size }}" height="{{ size }}" viewBox="0 0 14 14" fill="none"><circle cx="7" cy="7" r="5.75" stroke-width="1.5" stroke-dasharray="2.26 2.26" style="stroke:var(--pl-fg-3)"></circle></svg></sc-if>
<sc-if value="{{ isTodo }}" hint-placeholder-val="{{ false }}"><svg width="{{ size }}" height="{{ size }}" viewBox="0 0 14 14" fill="none"><circle cx="7" cy="7" r="5.75" stroke-width="1.5" style="stroke:var(--pl-fg-3)"></circle></svg></sc-if>
<sc-if value="{{ isProgress }}" hint-placeholder-val="{{ false }}"><svg width="{{ size }}" height="{{ size }}" viewBox="0 0 14 14" fill="none"><circle cx="7" cy="7" r="5.75" stroke-width="1.5" style="stroke:var(--pl-s-doing)"></circle><path d="M7 7V4.25A2.75 2.75 0 0 1 7 9.75Z" style="fill:var(--pl-s-doing)"></path></svg></sc-if>
<sc-if value="{{ isReview }}" hint-placeholder-val="{{ false }}"><svg width="{{ size }}" height="{{ size }}" viewBox="0 0 14 14" fill="none"><circle cx="7" cy="7" r="5.75" stroke-width="1.5" style="stroke:var(--pl-s-review)"></circle><path d="M7 7V4.25A2.75 2.75 0 1 1 4.25 7Z" style="fill:var(--pl-s-review)"></path></svg></sc-if>
<sc-if value="{{ isDone }}" hint-placeholder-val="{{ false }}"><svg width="{{ size }}" height="{{ size }}" viewBox="0 0 14 14" fill="none"><circle cx="7" cy="7" r="6.5" style="fill:var(--pl-s-done)"></circle><path d="M4.4 7.15l1.75 1.75 3.45-3.6" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" style="stroke:var(--pl-bg)"></path></svg></sc-if>
<sc-if value="{{ isCancelled }}" hint-placeholder-val="{{ false }}"><svg width="{{ size }}" height="{{ size }}" viewBox="0 0 14 14" fill="none"><circle cx="7" cy="7" r="6.5" style="fill:var(--pl-fg-3)"></circle><path d="M5 5l4 4M9 5l-4 4" stroke-width="1.5" stroke-linecap="round" style="stroke:var(--pl-bg)"></path></svg></sc-if>
<sc-if value="{{ isDeleted }}" hint-placeholder-val="{{ false }}"><svg width="{{ size }}" height="{{ size }}" viewBox="0 0 14 14" fill="none"><circle cx="7" cy="7" r="6.5" style="fill:var(--pl-danger)"></circle><path d="M4.6 7h4.8" stroke-width="1.5" stroke-linecap="round" style="stroke:var(--pl-bg)"></path></svg></sc-if>
<sc-if value="{{ isPNone }}" hint-placeholder-val="{{ false }}"><svg width="{{ size }}" height="{{ size }}" viewBox="0 0 14 14"><rect x="1.5" y="6.25" width="2.5" height="1.5" rx="0.75" style="fill:var(--pl-fg-3)"></rect><rect x="5.75" y="6.25" width="2.5" height="1.5" rx="0.75" style="fill:var(--pl-fg-3)"></rect><rect x="10" y="6.25" width="2.5" height="1.5" rx="0.75" style="fill:var(--pl-fg-3)"></rect></svg></sc-if>
<sc-if value="{{ isPBars }}" hint-placeholder-val="{{ false }}"><svg width="{{ size }}" height="{{ size }}" viewBox="0 0 14 14"><rect x="1.5" y="8.5" width="2.5" height="4" rx="1" style="fill:{{ b1 }}"></rect><rect x="5.75" y="5.5" width="2.5" height="7" rx="1" style="fill:{{ b2 }}"></rect><rect x="10" y="2.5" width="2.5" height="10" rx="1" style="fill:{{ b3 }}"></rect></svg></sc-if>
<sc-if value="{{ isPUrgent }}" hint-placeholder-val="{{ false }}"><svg width="{{ size }}" height="{{ size }}" viewBox="0 0 14 14"><rect x="1" y="1" width="12" height="12" rx="3" style="fill:var(--pl-accent)"></rect><path d="M7 4v3.6" stroke-width="1.6" stroke-linecap="round" style="stroke:var(--pl-bg)"></path><circle cx="7" cy="10" r="0.95" style="fill:var(--pl-bg)"></circle></svg></sc-if>
<sc-if value="{{ isProg }}" hint-placeholder-val="{{ false }}"><svg width="{{ size }}" height="{{ size }}" viewBox="0 0 14 14" fill="none"><circle cx="7" cy="7" r="5" stroke-width="2" style="stroke:var(--pl-border-strong)"></circle><circle cx="7" cy="7" r="5" stroke-width="2" stroke-dasharray="{{ dash }}" transform="rotate(-90 7 7)" style="stroke:{{ progColor }}"></circle></svg></sc-if>
</span>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:28,&quot;height&quot;:28},&quot;status&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;draft&quot;,&quot;todo&quot;,&quot;progress&quot;,&quot;review&quot;,&quot;done&quot;,&quot;cancelled&quot;,&quot;deleted&quot;],&quot;default&quot;:&quot;todo&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;priority&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;none&quot;,&quot;urgent&quot;,&quot;high&quot;,&quot;medium&quot;,&quot;low&quot;],&quot;default&quot;:null,&quot;tsType&quot;:&quot;string&quot;},&quot;progress&quot;:{&quot;editor&quot;:&quot;float&quot;,&quot;min&quot;:0,&quot;max&quot;:1,&quot;step&quot;:0.05,&quot;default&quot;:null,&quot;tsType&quot;:&quot;number&quot;},&quot;size&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:14,&quot;tsType&quot;:&quot;number&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const st = this.props.status, pr = this.props.priority, pg = this.props.progress;
    const p = pg == null || pg === '' ? null : Math.max(0, Math.min(1, parseFloat(pg)));
    const C = 2 * Math.PI * 5;
    const lvl = { low: 1, medium: 2, high: 3 }[pr] || 0;
    const on = 'var(--pl-fg-2)', off = 'var(--pl-border-strong)';
    return {
      size: this.props.size ?? 14,
      isDraft: st === 'draft', isTodo: st === 'todo', isProgress: st === 'progress', isReview: st === 'review',
      isDone: st === 'done', isCancelled: st === 'cancelled', isDeleted: st === 'deleted',
      isPNone: pr === 'none', isPBars: lvl > 0, isPUrgent: pr === 'urgent',
      b1: lvl >= 1 ? on : off, b2: lvl >= 2 ? on : off, b3: lvl >= 3 ? on : off,
      isProg: p !== null, dash: p !== null ? (p * C).toFixed(2) + ' ' + C.toFixed(2) : '0 40',
      progColor: p === 1 ? 'var(--pl-s-done)' : 'var(--pl-fg-2)'
    };
  }
}
</script>
</body>
</html>
