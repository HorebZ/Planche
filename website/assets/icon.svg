<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <title>Planche</title>
  <defs>
    <linearGradient id="lmH" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity=".22"></stop>
      <stop offset=".12" stop-color="#FFFFFF" stop-opacity=".07"></stop>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity=".04"></stop>
    </linearGradient>
    <linearGradient id="lmT" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#232325"></stop>
      <stop offset="1" stop-color="#0B0B0C"></stop>
    </linearGradient>
    <linearGradient id="lmM" gradientUnits="userSpaceOnUse" x1="22" y1="22" x2="78" y2="78">
      <stop offset="0" stop-color="#FFFFFF"></stop>
      <stop offset="1" stop-color="#85858D"></stop>
    </linearGradient>
    <linearGradient id="lmA" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F6A27C"></stop>
      <stop offset="1" stop-color="#EA6A38"></stop>
    </linearGradient>
    <filter id="lmB" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="5"></feGaussianBlur>
    </filter>
    <symbol id="lmIcon" viewBox="0 0 100 100">
      <rect width="100" height="100" rx="22.5" fill="url(#lmT)"></rect>
      <rect
        x=".3"
        y=".3"
        width="99.4"
        height="99.4"
        rx="22.2"
        fill="none"
        stroke="url(#lmH)"
        stroke-width=".6"
      ></rect>
      <rect
        x="61"
        y="25"
        width="17"
        height="30"
        rx="3.5"
        fill="#EE7746"
        fill-opacity=".55"
        filter="url(#lmB)"
      ></rect>
      <g fill="url(#lmM)">
        <rect x="22" y="22" width="17" height="25" rx="3.5"></rect>
        <rect x="22" y="50" width="17" height="28" rx="3.5"></rect>
        <rect x="41.5" y="22" width="17" height="13" rx="3.5"></rect>
        <rect x="41.5" y="38" width="17" height="17" rx="3.5"></rect>
        <rect x="41.5" y="58" width="17" height="20" rx="3.5"></rect>
        <rect x="61" y="55" width="17" height="23" rx="3.5"></rect>
      </g>
      <rect x="61" y="22" width="17" height="30" rx="3.5" fill="url(#lmA)"></rect>
    </symbol>
  </defs>
  <use href="#lmIcon" />
</svg>
